<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>确认 Offer - E时代</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #f5576c);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .offer-container {
            max-width: 500px;
            width: 90%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            padding: 3rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .offer-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 2rem auto;
            border-radius: 50%;
            background: url('https://we.emoera.com/img/elogo.jpg') no-repeat center center;
            background-size: cover;
            border: 4px solid #fff;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.1);
        }

        .offer-container h1 {
            color: #2c3e50;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .offer-title {
            font-size: 1.4rem;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .welcome-text {
            color: #7f8c8d;
            font-size: 1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .offer-btn {
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 200px;
        }

        .accept-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .accept-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }

        .accepted-btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(46, 204, 113, 0.3);
            transition: all 0.3s ease;
        }

        .accepted-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(46, 204, 113, 0.4);
        }

        .loading-btn {
            background: linear-gradient(135deg, #bdc3c7, #95a5a6);
            color: white;
            cursor: not-allowed;
        }

        .error-btn {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            cursor: default;
        }

        .error-container {
            max-width: 400px;
            width: 90%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            padding: 3rem;
            text-align: center;
        }

        .error-icon {
            font-size: 4rem;
            color: #e74c3c;
            margin-bottom: 1rem;
        }



        .confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        /* 右上角Toast通知样式 */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
            max-width: 350px;
        }

        .toast-custom {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .toast-custom .toast-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 16px;
        }

        .toast-custom .toast-body {
            padding: 16px;
            font-size: 14px;
            line-height: 1.5;
        }

        .toast-success .toast-header {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }

        .toast-error .toast-header {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }

        @media (max-width: 576px) {
            .offer-container {
                padding: 2rem;
            }
            
            .offer-container h1 {
                font-size: 1.6rem;
            }
            
            .offer-title {
                font-size: 1.2rem;
            }
            
            .toast-container {
                top: 10px;
                right: 10px;
                left: 10px;
                max-width: none;
            }
            
            .toast-custom {
                width: 100%;
            }
        }
    </style>
</head>
<body>

{% if error %}
<div class="error-container">
    <i class="fas fa-exclamation-triangle error-icon"></i>
    <h2 class="text-danger mb-3">出现错误</h2>
    <p class="text-muted">{{ error }}</p>
    <button class="btn btn-outline-primary mt-3" onclick="window.close()">
        <i class="fas fa-arrow-left me-2"></i>返回
    </button>
</div>
{% else %}
<div class="offer-container">
    <div class="logo"></div>
    <h1>您好，{{ application.real_name }}！</h1>
    <div class="offer-title">
        <i class="fas fa-trophy text-warning me-2"></i>
        恭喜获得 E时代 核心团队 Offer
    </div>
    <p class="welcome-text">
        感谢您对E时代的关注与支持！我们的社团文化是开放包容，真诚热爱，欢迎您的加入。
        <br><br>
        期待与您一同开启新的征程，互相支持，共同成长。
    </p>

    {% if confirmed %}
        <button class="offer-btn accepted-btn" id="acceptedBtn">
            <i class="fas fa-check-circle me-2"></i>已接受
        </button>
        <div class="mt-3">
            <small class="text-muted">
                <i class="fas fa-calendar-alt me-1"></i>
                确认时间：{{ application.offer_confirmed_at|date:"Y年m月d日" }}
            </small>
        </div>
    {% else %}
        <button class="offer-btn loading-btn" id="offerBtn" disabled>
            <span class="spinner-border spinner-border-sm me-2"></span>
            加载中...
        </button>
    {% endif %}
    
    <div class="mt-4">
        <small class="text-muted">
            <i class="fas fa-heart text-danger me-1"></i>
            再次感谢您的加入 - E时代研发中心
        </small>
    </div>
</div>
{% endif %}

<!-- Toast通知容器 -->
<div class="toast-container" id="toastContainer"></div>

<canvas class="confetti-canvas" id="confettiCanvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// 创建Toast通知
function showToast(title, message, type = 'info', autoHide = true) {
    const toastContainer = document.getElementById('toastContainer');
    const toastId = 'toast-' + Date.now();
    
    const iconMap = {
        success: 'fas fa-check-circle',
        error: 'fas fa-exclamation-triangle',
        info: 'fas fa-info-circle'
    };
    
    const toastHtml = `
        <div class="toast toast-custom toast-${type}" id="${toastId}" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <i class="${iconMap[type]} me-2"></i>
                <strong class="me-auto">${title}</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body">
                ${message}
            </div>
        </div>
    `;
    
    toastContainer.insertAdjacentHTML('beforeend', toastHtml);
    
    const toastElement = document.getElementById(toastId);
    const toast = new bootstrap.Toast(toastElement, {
        autohide: autoHide,
        delay: autoHide ? 4000 : 0
    });
    
    toast.show();
    
    // 自动清理DOM
    toastElement.addEventListener('hidden.bs.toast', function () {
        toastElement.remove();
    });
    
    return toast;
}

// 全局烟花系统
let globalConfetti = [];
let isAnimating = false;
let canvas, ctx;

// 初始化烟花系统
function initConfettiSystem() {
    canvas = document.getElementById('confettiCanvas');
    ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    canvas.style.display = 'block';
}

// 创建新的烟花效果（可叠加）
function createConfetti(sourceElement = null) {
    if (!canvas) {
        initConfettiSystem();
    }
    
    const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#FFD700', '#FF6B6B', '#4ecdc4', '#45b7d1', '#ff9a9e', '#fecfef'];
    
    // 确定烟花发射源位置
    let sourceX = canvas.width / 2;
    let sourceY = canvas.height / 2;
    
    if (sourceElement) {
        const rect = sourceElement.getBoundingClientRect();
        sourceX = rect.left + rect.width / 2;
        sourceY = rect.top + rect.height / 2;
    }
    
    // 添加新的烟花粒子到全局数组
    for (let i = 0; i < 150; i++) {
        // 计算发射角度和速度
        const angle = (Math.PI * 2 * i) / 150 + Math.random() * 0.5;
        const velocity = Math.random() * 8 + 4;
        const vx = Math.cos(angle) * velocity;
        const vy = Math.sin(angle) * velocity - Math.random() * 3;
        
        globalConfetti.push({
            x: sourceX + (Math.random() - 0.5) * 50,
            y: sourceY + (Math.random() - 0.5) * 50,
            vx: vx,
            vy: vy,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: Math.random() * 8 + 2,
            rotation: Math.random() * 360,
            rotationSpeed: (Math.random() - 0.5) * 20,
            life: 1.0,
            decay: Math.random() * 0.015 + 0.003,
            shape: Math.random() > 0.7 ? 'circle' : 'square'
        });
    }
    
    // 添加一些额外的大颗粒
    for (let i = 0; i < 30; i++) {
        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 6 + 2;
        
        globalConfetti.push({
            x: sourceX,
            y: sourceY,
            vx: Math.cos(angle) * velocity,
            vy: Math.sin(angle) * velocity - 2,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: Math.random() * 12 + 8,
            rotation: Math.random() * 360,
            rotationSpeed: (Math.random() - 0.5) * 10,
            life: 1.0,
            decay: Math.random() * 0.01 + 0.002,
            shape: 'star'
        });
    }
    
    // 如果动画没有在运行，启动它
    if (!isAnimating) {
        startConfettiAnimation();
    }
}

// 烟花动画循环
function startConfettiAnimation() {
    isAnimating = true;
    
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 渲染所有烟花粒子
        for (let i = globalConfetti.length - 1; i >= 0; i--) {
            const particle = globalConfetti[i];
            
            // 更新位置
            particle.x += particle.vx;
            particle.y += particle.vy;
            particle.vy += 0.1; // 重力效果
            particle.rotation += particle.rotationSpeed;
            particle.life -= particle.decay;
            
            // 如果粒子消失或掉出屏幕，移除它
            if (particle.life <= 0 || particle.y > canvas.height + 50) {
                globalConfetti.splice(i, 1);
                continue;
            }
            
            // 绘制粒子
            ctx.save();
            ctx.translate(particle.x, particle.y);
            ctx.rotate(particle.rotation * Math.PI / 180);
            ctx.globalAlpha = particle.life;
            ctx.fillStyle = particle.color;
            
            // 根据形状绘制不同的粒子
            if (particle.shape === 'circle') {
                ctx.beginPath();
                ctx.arc(0, 0, particle.size / 2, 0, Math.PI * 2);
                ctx.fill();
            } else if (particle.shape === 'star') {
                drawStar(ctx, 0, 0, 5, particle.size / 2, particle.size / 4);
                ctx.fill();
            } else {
                // 默认方形
                ctx.fillRect(-particle.size/2, -particle.size/2, particle.size, particle.size);
            }
            
            ctx.restore();
        }
        
        // 如果还有粒子，继续动画
        if (globalConfetti.length > 0) {
            requestAnimationFrame(animate);
        } else {
            isAnimating = false;
            canvas.style.display = 'none';
        }
    }
    
    animate();
}

// 绘制星形的辅助函数
function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
    let rot = Math.PI / 2 * 3;
    let x = cx;
    let y = cy;
    const step = Math.PI / spikes;
    
    ctx.beginPath();
    ctx.moveTo(cx, cy - outerRadius);
    
    for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;
        
        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
    }
    
    ctx.lineTo(cx, cy - outerRadius);
    ctx.closePath();
}

// 清除所有烟花
function clearAllConfetti() {
    globalConfetti = [];
    isAnimating = false;
    if (canvas) {
        canvas.style.display = 'none';
    }
}

// 处理offer确认
function acceptOffer() {
    const offerBtn = document.getElementById('offerBtn');
    
    // 立即触发烟花效果，从按钮位置爆发
    createConfetti(offerBtn);
    
    offerBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>确认中...';
    offerBtn.disabled = true;
    
    fetch(window.location.href, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success' || data.status === 'already_confirmed') {
            // 显示成功效果
            offerBtn.innerHTML = '<i class="fas fa-check-circle me-2"></i>已接受';
            offerBtn.className = 'offer-btn accepted-btn';
            
            // 确保按钮可点击并重新绑定点击事件为烟花触发
            offerBtn.disabled = false;
            offerBtn.style.cursor = 'pointer';
            offerBtn.onclick = function() {
                createConfetti(offerBtn);
                showToast('太棒了！', '欢迎加入E时代！刷新页面点击“已接受”按钮可重放烟花', 'success');
            };
            
            // 显示成功消息
            showToast('恭喜！', '您已成功接受offer，欢迎加入E时代！', 'success');
            
            // 自动刷新页面以显示确认时间
            setTimeout(() => {
                location.reload();
            }, 10);
        } else {
            offerBtn.innerHTML = '<i class="fas fa-times me-2"></i>确认失败';
            offerBtn.className = 'offer-btn error-btn';
            
            showToast('确认失败', '请联系管理员处理', 'error');
        }
    })
    .catch(() => {
        offerBtn.innerHTML = '<i class="fas fa-times me-2"></i>网络错误';
        offerBtn.className = 'offer-btn error-btn';
        
        showToast('网络错误', '请检查网络连接，点击按钮重试', 'error', false);
        
        // 3秒后自动重新加载
        setTimeout(() => {
            location.reload();
        }, 3000);
    });
}

// Offer确认不需要CSRF Token（已在后端设置为exempt）

// 页面加载完成后的初始化
document.addEventListener('DOMContentLoaded', function() {
    const offerBtn = document.getElementById('offerBtn');
    const acceptedBtn = document.getElementById('acceptedBtn');
    
    if (offerBtn) {
        // 模拟加载过程
        setTimeout(() => {
            offerBtn.innerHTML = '<i class="fas fa-handshake me-2"></i>接受 Offer';
            offerBtn.className = 'offer-btn accept-btn';
            offerBtn.disabled = false;
            offerBtn.onclick = acceptOffer;
        }, 1500);
    }
    
    if (acceptedBtn) {
        // 已接受状态的按钮点击效果 - 确保按钮可点击
        acceptedBtn.disabled = false;
        acceptedBtn.style.cursor = 'pointer';
        acceptedBtn.onclick = function() {
            createConfetti(acceptedBtn);
            showToast('太棒了！', '欢迎加入E时代！刷新页面点击“已接受”按钮可重放烟花', 'success');
        };
    }
});

// 窗口大小改变时重新调整confetti画布
window.addEventListener('resize', function() {
    if (canvas) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
});
</script>

</body>
</html>
